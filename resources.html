<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>資源總覽｜日語導航</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html">日語<span>導航</span></a>
  <nav>
    <a href="index.html">首頁</a>
    <a href="resources.html" class="active">資源總覽</a>
  </nav>
</header>

<main>
  <section style="padding-top: 1.6rem;">
    <div class="search-box on-paper" style="max-width: none; margin-bottom: 0.4rem;">
      <input
        id="search-input"
        type="search"
        placeholder="搜尋名稱、程度、標籤...（例如：N2、線上報名、免費）"
        aria-label="搜尋資源"
      />
    </div>

    <div class="filter-bar" id="category-filters">
      <!-- 由 script.js 動態產生 -->
    </div>

    <p class="filter-sublabel">依偏差值篩選（僅適用大學資源）</p>
    <div class="filter-bar" id="level-filters">
      <!-- 由 script.js 動態產生 -->
    </div>

    <p class="result-count" id="result-count"></p>

    <div class="resource-list" id="resource-list">
      <!-- 由 script.js 動態產生 -->
    </div>
  </section>
</main>

<footer class="site-footer">
  <p>本站僅整理與比較外部資源，不代管教材內容。所有資訊請以各官方網站公告為準。</p>
  <p class="source-note">大學偏差值區間資料來源：河合塾 Kei-Net　2027年度　一般選拔。</p>
</footer>

<script src="data.js"></script>
<script src="script.js"></script>
<script>
  initResourcesPage();
</script>
</body>
</html>
